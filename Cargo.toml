[package]
name = "TermLaunch-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "TermLaunch-cli"
path = "src/main.rs"

[[bin]]
name = "TermLaunch-daemon"
path = "src/system/daemon.rs"

[dependencies]
crossterm = "0.29.0"
meval = "0.2.0"
ratatui = "0.30.0"
rdev = "0.5.3"
lazy_static = "1.4.0"
core-graphics = "0.21.0"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
home = "0.5.12"
toml = "1.0.3"
log = "0.4.29"
simplelog = "0.12.2"
dirs = "6.0.0"
